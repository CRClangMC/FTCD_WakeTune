<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿账户注册</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <form action="/accessph/" method="POST">
        <label for="phone">注册您的投稿账户</label><br/>
        <label for="phone">手机号：</label>
        <input type="text" id="phone" name="phone" placeholder="请输入手机号">
        <button type="submit" id="hq" name="hq">获取验证码</button>
            {% if warn %}
            <font color="#FF0000">  {{warn}} </font>
            {% endif %}
    </form>
</body>
</html>
